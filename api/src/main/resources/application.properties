spring.application.name=api
server.port=8080
spring.config.import=file:.env.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/concertflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
app.security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}
app.security.jwt.remember-me-expiration-ms=${JWT_REMEMBER_ME_EXPIRATION_MS}
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
